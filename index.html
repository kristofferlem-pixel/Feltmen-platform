<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TeamGym Infinite Platformer</title>
<style>
  * {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }
  html, body {
    margin: 0; padding: 0;
    background: #1a1a2e;
    overflow: hidden;
    height: 100%;
    height: 100dvh;
    font-family: system-ui, sans-serif;
  }
  #app-root {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #1a1a2e;
    box-sizing: border-box;
    padding: 8px;
  }
  #app-root:fullscreen { background: #000; }
  #game-stage {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-container { box-shadow: 0 0 40px rgba(0,0,0,0.5); max-width: 100%; max-height: 100%; }
  #game-container canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }
  #hint {
    position: absolute; top: 8px; left: 8px;
    color: #eee; font-size: 12px; z-index: 10;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px;
    max-width: 78%;
  }
  #btn-fullscreen {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  #touch-controls {
    flex: 0 0 auto;
    width: 100%;
    display: flex; justify-content: center; align-items: center;
    gap: 16px; z-index: 10;
  }
  .touch-btn {
    touch-action: none;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 20px; font-weight: bold;
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .touch-btn:active { background: rgba(255,255,255,0.35); }
  .touch-btn svg { pointer-events: none; }
  .touch-btn-jump {
    width: 88px; height: 58px; border-radius: 29px; font-size: 13px;
    background: rgba(126, 217, 87, 0.35); border-color: rgba(126,217,87,0.8);
  }
  .touch-btn-reset {
    background: rgba(255, 209, 102, 0.3);
    border-color: rgba(255, 209, 102, 0.7);
    font-size: 26px;
  }
  #error-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: #2a0a0a; color: #ffb3b3;
    font-family: monospace; font-size: 13px;
    padding: 16px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  #error-overlay h2 { color: #ff6b6b; margin: 0 0 10px; font-family: system-ui, sans-serif; }
  #js-heartbeat {
    position: fixed; bottom: 4px; right: 4px; z-index: 1001;
    font-family: monospace; font-size: 10px; color: #555;
  }
</style>
</head>
<body>
<div id="error-overlay"><h2>Something crashed</h2><div id="error-overlay-text"></div></div>
<div id="js-heartbeat">js: not started</div>
<div id="app-root">
  <div id="hint">\u2190 \u2192 r\u00f6r dig &nbsp;|&nbsp; JUMP: hoppa (extra kraft fr\u00e5n trampett) &nbsp;|&nbsp; R/\u21bb: starta om</div>
  <button id="btn-fullscreen" aria-label="fullscreen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="game-stage">
    <div id="game-container"></div>
  </div>
  <div id="touch-controls">
    <button id="btn-left" class="touch-btn" aria-label="left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-jump" class="touch-btn touch-btn-jump">JUMP</button>
    <button id="btn-right" class="touch-btn" aria-label="right">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-reset" class="touch-btn touch-btn-reset">\u21bb</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// ============================================================
// On-device crash + progress display: shows any uncaught error, and a
// running status of how far setup got, directly on the page - so this
// can be diagnosed on a phone without devtools.
// ============================================================
function heartbeat(msg) {
  const el = document.getElementById('js-heartbeat');
  if (el) el.textContent = 'js: ' + msg;
}
heartbeat('script tag started');

function showFatalError(title, detail) {
  const overlay = document.getElementById('error-overlay');
  const text = document.getElementById('error-overlay-text');
  text.textContent = `${title}\n\n${detail}\n\nUser agent:\n${navigator.userAgent}`;
  overlay.style.display = 'block';
}
window.addEventListener('error', (e) => {
  showFatalError(e.message || 'Unknown error', (e.error && e.error.stack) || `${e.filename}:${e.lineno}:${e.colno}`);
});
window.addEventListener('unhandledrejection', (e) => {
  const reason = e.reason;
  showFatalError('Unhandled promise rejection', (reason && reason.stack) || String(reason));
});

// Watchdog: if the Phaser canvas hasn't appeared after a few seconds,
// something hung without throwing a catchable error - show that too.
setTimeout(() => {
  const canvas = document.querySelector('#game-container canvas');
  if (!canvas) {
    showFatalError('Timed out waiting for the game to start', `Last status: ${document.getElementById('js-heartbeat').textContent}`);
  }
}, 6000);

try {
  // ============================================================
  // Hard backstop against selection/callout, on top of the CSS above -
  // some mobile browsers still trigger selection on rapid/long taps
  // unless this is blocked at the event level too.
  // ============================================================
  ['selectstart', 'contextmenu', 'dragstart'].forEach((evt) => {
    document.addEventListener(evt, (e) => e.preventDefault());
  });
  heartbeat('selection backstop ok');
} catch (err) {
  showFatalError('Selection backstop failed', err.stack || String(err));
}

try {
  // ============================================================
  // Fullscreen toggle
  // ============================================================
  (function setupFullscreen() {
    const root = document.getElementById('app-root');
    const btn = document.getElementById('btn-fullscreen');
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
      const request = root.requestFullscreen || root.webkitRequestFullscreen;
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      try {
        if (!isFullscreen && request) {
          request.call(root).catch(() => {});
        } else if (isFullscreen && exit) {
          exit.call(document);
        }
      } catch (err) {
        // Fullscreen can be blocked (e.g. an embedding iframe without
        // allow="fullscreen") - fail silently rather than break the game.
      }
    });
  })();
  heartbeat('fullscreen setup ok');
} catch (err) {
  showFatalError('Fullscreen setup failed', err.stack || String(err));
}

// ============================================================
// Shared touch + keyboard input state
// ============================================================
window.touchState = { left: false, right: false, jumpPressed: false, resetPressed: false };
try {
(function setupTouchControls() {
  const bindHold = (el, key) => {
    const start = (e) => { e.preventDefault(); window.touchState[key] = true; };
    const end = (e) => { e.preventDefault(); window.touchState[key] = false; };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', end);
  };
  bindHold(document.getElementById('btn-left'), 'left');
  bindHold(document.getElementById('btn-right'), 'right');
  document.getElementById('btn-jump').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    window.touchState.jumpPressed = true;
  });
  document.getElementById('btn-reset').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    window.touchState.resetPressed = true;
  });
})();
heartbeat('touch controls bound');
} catch (err) {
  showFatalError('Touch controls setup failed', err.stack || String(err));
}

// ============================================================
// Embedded assets (base64), decoded fully in-memory:
// - the PNGs are loaded via a plain <img> tag using a data: URI
//   (governed by img-src, not a network fetch)
// - the XML atlas data is parsed directly from the decoded string
//   with DOMParser (pure in-memory, no network at all)
// This avoids Phaser's built-in loader, which fetches its files
// over the network (blob:/http:) and can be blocked in sandboxed
// environments.
// ============================================================
function loadImageFromDataURI(dataURI) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataURI;
  });
}

// ============================================================
// Normalizes every "problem" TexturePacker frame:
//  - rotated="true" frames, whose Phaser UV rotation didn't come out
//    right for this file
//  - trimmed frames in general, so rotated and non-rotated frames of
//    the same animation (e.g. the run cycle) go through the SAME
//    sizing pipeline. Mixing Phaser's native trimmed-frame handling
//    with our own canvas frames caused a visible per-frame "jitter"
//    since the two systems didn't anchor identically.
//
// Important XML semantics (easy to misread):
//   x, y, width, height   = the region AS STORED in the sheet - for a
//                            rotated frame this is already the rotated
//                            (swapped) size, not the final size.
//   frameX, frameY,
//   frameWidth, frameHeight = optional trim info: frameWidth/frameHeight
//                            is the ORIGINAL untrimmed sprite size, and
//                            frameX/frameY is where the trimmed content
//                            sits within that original box (usually
//                            negative or zero). Frames with no trim
//                            attributes (e.g. Trampett) simply have no
//                            padding - the packed content IS the full
//                            frame once un-rotated.
//
// If frames still look mirrored/wrong, flip ROTATION_SIGN between -1
// and 1 - that's the only thing to change.
// ============================================================
const ROTATION_SIGN = -1;

function buildNormalizedTextures(img, xmlDoc, usedNames) {
  const overrides = {};
  const subs = xmlDoc.getElementsByTagName("SubTexture");
  for (let i = 0; i < subs.length; i++) {
    const el = subs[i];
    const name = el.getAttribute("name");
    if (usedNames && !usedNames.has(name)) continue; // skip frames the game never uses

    const rotated = el.getAttribute("rotated") === "true";
    const hasTrim = el.hasAttribute("frameWidth");
    if (!rotated && !hasTrim) continue; // plain frame - Phaser's atlas handles this fine already

    const x = parseFloat(el.getAttribute("x"));
    const y = parseFloat(el.getAttribute("y"));
    const storedW = parseFloat(el.getAttribute("width"));  // as stored in the sheet
    const storedH = parseFloat(el.getAttribute("height"));

    // If rotated, the stored rect is swapped relative to final orientation.
    const trimmedW = rotated ? storedH : storedW;
    const trimmedH = rotated ? storedW : storedH;

    const frameW = hasTrim ? parseFloat(el.getAttribute("frameWidth")) : trimmedW;
    const frameH = hasTrim ? parseFloat(el.getAttribute("frameHeight")) : trimmedH;
    const frameX = hasTrim ? parseFloat(el.getAttribute("frameX")) : 0;
    const frameY = hasTrim ? parseFloat(el.getAttribute("frameY")) : 0;

    // 1. Crop the packed region, un-rotating it first if needed.
    const trimmedCanvas = document.createElement("canvas");
    trimmedCanvas.width = trimmedW;
    trimmedCanvas.height = trimmedH;
    const tctx = trimmedCanvas.getContext("2d");
    if (rotated) {
      tctx.translate(trimmedW / 2, trimmedH / 2);
      tctx.rotate(ROTATION_SIGN * Math.PI / 2);
      tctx.drawImage(img, x, y, storedW, storedH, -storedW / 2, -storedH / 2, storedW, storedH);
    } else {
      tctx.drawImage(img, x, y, storedW, storedH, 0, 0, storedW, storedH);
    }

    // 2. Place the trimmed content into the full untrimmed frame box, so
    // every frame of an animation shares the same canvas size/anchor.
    const canvas = document.createElement("canvas");
    canvas.width = frameW;
    canvas.height = frameH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(trimmedCanvas, -frameX, -frameY);

    overrides[name] = canvas;
  }
  return overrides;
}

// Returns the [textureKey, frame] args to pass to Phaser image/setTexture
// calls, transparently substituting a rotation-fixed standalone texture
// when one exists for that frame name.
function tex(atlasKey, frameName) {
  if (window.__atlasAssets.rotatedOverrides[frameName]) {
    return [frameName];
  }
  return [atlasKey, frameName];
}

// ============================================================
// TUNING - play with these to change the feel
// ============================================================
const TUNING = {
  moveSpeed: 310,           // px/s left-right movement (grounded and air)
  jumpVelocity: -13,        // normal jump strength
  trampettJumpVelocity: -21,// boosted jump strength when launching from a Trampett platform
  gravity: 0.55,
  airRotationSpeed: 480,    // degrees/sec - cosmetic flip when launched off a trampett
  runFrameMs: 40,           // how fast the run-cycle animation flips frames
  groundLevelY: 420,        // y of the very first platform
  cameraOffsetX: 250,       // player's fixed screen x; the world scrolls under them
  playerHalfWidth: 14,      // collision half-width for platform landing checks
  platformThickness: 26,
  platformMinWidth: 130,
  platformMaxWidth: 220,
  platformMinGap: 70,
  platformMaxGap: 170,
  platformMaxYStep: 110,    // max height change between consecutive platforms
  platformYMin: 180,        // highest a platform can be (smaller y = higher up)
  platformYMax: 470,        // lowest a platform can be
  trampettChance: 0.3,
  fallDeathY: 650,
};

// Which atlas texture key each GymnastSprint frame lives in (they're
// split across the two spritesheets/pages).
const SPRINT_FRAME_ATLAS = {
  "GymnastSprint0001": "atlas1", "GymnastSprint0002": "atlas0",
  "GymnastSprint0003": "atlas0", "GymnastSprint0004": "atlas0",
  "GymnastSprint0005": "atlas1", "GymnastSprint0006": "atlas1",
  "GymnastSprint0007": "atlas0", "GymnastSprint0008": "atlas1",
  "GymnastSprint0009": "atlas1", "GymnastSprint0010": "atlas0",
  "GymnastSprint0011": "atlas0", "GymnastSprint0012": "atlas0",
  "GymnastSprint0013": "atlas0", "GymnastSprint0014": "atlas1",
  "GymnastSprint0015": "atlas1", "GymnastSprint0016": "atlas1",
  "GymnastSprint0017": "atlas1", "GymnastSprint0018": "atlas0",
};
const SPRINT_ORDER = Object.keys(SPRINT_FRAME_ATLAS).sort();

const POSES = {
  tucked: { atlas: "atlas0", frame: "GymnastTucked", icon: { atlas: "atlas0", frame: "IconGymnastTucked" } },
  piked:  { atlas: "atlas0", frame: "GymnastPiked",  icon: { atlas: "atlas0", frame: "IconGymnastPiked" } },
  layout: { atlas: "atlas1", frame: "GymnastLayout", icon: { atlas: "atlas0", frame: "IconGymnastLayout" } },
};

// Only these frames get the (somewhat expensive) canvas normalization
// pass at boot time - the atlases also contain dozens of Twist frames
// etc. that this game doesn't use, and building those too was the
// main cause of the slow first load.
const USED_FRAME_NAMES = new Set([
  ...SPRINT_ORDER,
  "Trampett", "City", "LandingLEG",
  POSES.tucked.frame, POSES.tucked.icon.frame,
  POSES.piked.frame, POSES.piked.icon.frame,
  POSES.layout.frame, POSES.layout.icon.frame,
]);

class PlatformerScene extends Phaser.Scene {
  constructor() { super("PlatformerScene"); }

  preload() {
    // no-op: atlases are added directly in create() from pre-loaded
    // in-memory image/XML data (see boot() at the bottom of this file)
  }

  create() {
    if (!this.textures.exists("atlas0")) {
      this.textures.addAtlasXML("atlas0", window.__atlasAssets.img0, window.__atlasAssets.xml0);
    }
    if (!this.textures.exists("atlas1")) {
      this.textures.addAtlasXML("atlas1", window.__atlasAssets.img1, window.__atlasAssets.xml1);
    }
    Object.entries(window.__atlasAssets.rotatedOverrides).forEach(([name, canvas]) => {
      if (!this.textures.exists(name)) this.textures.addCanvas(name, canvas);
    });

    // --- Background: tiles infinitely and scrolls at a fraction of the
    // camera speed (parallax depth). tilePositionY is never touched, so
    // it stays locked to its base level even during vertical camera
    // follow (e.g. a trampett super jump) instead of drifting with it.
    this.bg = this.add.tileSprite(400, 250, 800, 500, ...tex("atlas0", "City")).setScrollFactor(0).setDepth(0);
    this.bgParallaxFactor = 0.3;

    // --- Player state (world-space coordinates) ---
    this.playerWorldX = 80;
    this.playerWorldY = TUNING.groundLevelY;
    this.velY = 0;
    this.grounded = true;
    this.currentPlatform = null;
    this.selectedPose = "tucked";
    this.autoFlip = false;
    this.airRotation = 0;
    this.runFrameIndex = 0;
    this.runFrameTimer = 0;
    this.distance = 0;
    this.gameOver = false;

    // --- Player display: a container that only ever TRANSLATES (world
    // position/feet anchor), holding a sprite that rotates around its
    // own center. This keeps the rotation pivot at the gymnast's
    // center regardless of where their feet/ground anchor is. ---
    this.playerContainer = this.add.container(TUNING.cameraOffsetX, this.playerWorldY).setDepth(10);
    this.playerSprite = this.add.image(0, 0, ...tex("atlas0", "GymnastSprint0002")).setScale(0.35);
    this.playerContainer.add(this.playerSprite);
    this.repositionPlayerSprite();

    // --- Platforms (procedurally generated ahead of the player) ---
    this.platforms = [];
    this.rightmostX = 0;
    this.spawnPlatform(0, TUNING.groundLevelY, 260, false);
    while (this.rightmostX < TUNING.cameraOffsetX + 900) this.spawnNextPlatform();

    // --- Pose picker (fixed to the screen, not the world) ---
    this.poseButtons = {};
    Object.keys(POSES).forEach((key, i) => {
      const icon = POSES[key].icon;
      const btn = this.add.image(60 + i * 60, 40, ...tex(icon.atlas, icon.frame))
        .setDisplaySize(48, 48)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true })
        .setDepth(20);
      btn.on("pointerdown", () => { this.selectedPose = key; this.updatePoseButtonHighlight(); });
      this.poseButtons[key] = btn;
    });
    this.updatePoseButtonHighlight();

    this.statusText = this.add.text(20, 505, "<- -> to move, JUMP to hop - land a trampett for a super jump!", {
      fontSize: "15px", color: "#ffffff",
    }).setScrollFactor(0).setDepth(20);

    this.distanceText = this.add.text(780, 14, "0m", {
      fontSize: "16px", color: "#ffe66d",
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(20);

    // --- Input ---
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.resetKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
  }

  // Keeps the sprite's own center as its rotation pivot, while its
  // bottom edge stays lined up with the container's y=0 (the
  // player's feet / ground-contact point).
  repositionPlayerSprite() {
    this.playerSprite.y = -this.playerSprite.displayHeight / 2;
  }

  setPlayerTexture(atlasKey, frameName, scale) {
    this.playerSprite.setTexture(...tex(atlasKey, frameName));
    if (scale) this.playerSprite.setScale(scale);
    this.repositionPlayerSprite();
  }

  // y is the surface line the player's feet rest on.
  spawnPlatform(x, y, width, hasTrampett) {
    const ground = this.add.image(x + width / 2, y + TUNING.platformThickness / 2, ...tex("atlas0", "LandingLEG"))
      .setDisplaySize(width, TUNING.platformThickness)
      .setDepth(2);
    let trampettSprite = null;
    if (hasTrampett) {
      trampettSprite = this.add.image(x + width * 0.75, y, ...tex("atlas1", "Trampett"))
        .setOrigin(0.5, 1)
        .setScale(0.32)
        .setDepth(3);
    }
    const platform = { x, y, width, hasTrampett, groundSprite: ground, trampettSprite };
    this.platforms.push(platform);
    this.rightmostX = Math.max(this.rightmostX, x + width);
    return platform;
  }

  spawnNextPlatform() {
    const gap = Phaser.Math.Between(TUNING.platformMinGap, TUNING.platformMaxGap);
    const width = Phaser.Math.Between(TUNING.platformMinWidth, TUNING.platformMaxWidth);
    const lastY = this.platforms.length ? this.platforms[this.platforms.length - 1].y : TUNING.groundLevelY;
    let y = lastY + Phaser.Math.Between(-TUNING.platformMaxYStep, TUNING.platformMaxYStep);
    y = Phaser.Math.Clamp(y, TUNING.platformYMin, TUNING.platformYMax);
    const hasTrampett = Math.random() < TUNING.trampettChance;
    this.spawnPlatform(this.rightmostX + gap, y, width, hasTrampett);
  }

  cleanupPlatforms(scrollX) {
    const cutoff = scrollX - 150;
    this.platforms = this.platforms.filter((p) => {
      if (p.x + p.width < cutoff) {
        p.groundSprite.destroy();
        if (p.trampettSprite) p.trampettSprite.destroy();
        return false;
      }
      return true;
    });
  }

  updatePoseButtonHighlight() {
    Object.entries(this.poseButtons).forEach(([key, btn]) => {
      btn.setAlpha(key === this.selectedPose ? 1 : 0.45);
    });
  }

  doJump() {
    const boosted = !!(this.currentPlatform && this.currentPlatform.hasTrampett);
    this.velY = boosted ? TUNING.trampettJumpVelocity : TUNING.jumpVelocity;
    this.grounded = false;
    this.currentPlatform = null;
    this.autoFlip = boosted;
    this.airRotation = 0;
    this.playerSprite.setRotation(0);

    if (boosted) {
      const pose = POSES[this.selectedPose];
      this.setPlayerTexture(pose.atlas, pose.frame, 0.4);
    }
    // normal jumps: leave the sprite as-is - the run-cycle animation in
    // update() keeps cycling, giving a flailing/running look in the air
    this.statusText.setText(boosted ? "Trampett boost!" : "Jump!");
  }

  update(time, delta) {
    const dt = delta / 1000;

    if (this.resetKey.isDown || (window.touchState && window.touchState.resetPressed)) {
      if (window.touchState) window.touchState.resetPressed = false;
      this.scene.restart();
      return;
    }
    const touch = window.touchState || {};
    const leftDown = this.cursors.left.isDown || touch.left;
    const rightDown = this.cursors.right.isDown || touch.right;
    const jumpJustPressed = Phaser.Input.Keyboard.JustDown(this.spaceKey) || touch.jumpPressed;
    if (touch.jumpPressed) touch.jumpPressed = false;

    if (this.gameOver) {
      if (jumpJustPressed) this.scene.restart();
      return;
    }

    // --- Horizontal movement ---
    let moveDir = 0;
    if (leftDown) moveDir = -1;
    else if (rightDown) moveDir = 1;
    this.playerWorldX = Math.max(30, this.playerWorldX + moveDir * TUNING.moveSpeed * dt);

    // --- Jump input ---
    if (this.grounded && jumpJustPressed) this.doJump();

    // --- Gravity + vertical motion ---
    const prevY = this.playerWorldY;
    this.velY += TUNING.gravity;
    this.playerWorldY += this.velY;

    // --- Platform landing check (falling onto a platform top) ---
    if (this.velY >= 0) {
      const halfW = TUNING.playerHalfWidth;
      for (const p of this.platforms) {
        const withinX = this.playerWorldX + halfW > p.x && this.playerWorldX - halfW < p.x + p.width;
        if (withinX && prevY <= p.y && this.playerWorldY >= p.y) {
          this.playerWorldY = p.y;
          this.velY = 0;
          this.grounded = true;
          this.currentPlatform = p;
          this.autoFlip = false;
          this.airRotation = 0;
          this.playerSprite.setRotation(0);
          break;
        }
      }
    }

    // --- Fell into the void ---
    if (this.playerWorldY > TUNING.fallDeathY) {
      this.gameOver = true;
      this.statusText.setText("Fell! Press JUMP or R to try again");
      return;
    }

    // --- Animate / rotate ---
    if (this.grounded) {
      if (moveDir !== 0) {
        this.playerSprite.setFlipX(moveDir < 0);
        this.runFrameTimer += delta;
        if (this.runFrameTimer > TUNING.runFrameMs) {
          this.runFrameTimer = 0;
          this.runFrameIndex = (this.runFrameIndex + 1) % SPRINT_ORDER.length;
          const frameName = SPRINT_ORDER[this.runFrameIndex];
          this.setPlayerTexture(SPRINT_FRAME_ATLAS[frameName], frameName, 0.35);
        }
      } else {
        this.setPlayerTexture("atlas0", "GymnastSprint0002", 0.35);
      }
    } else if (this.autoFlip) {
      // Trampett-boosted jump: keep the tumbling flip.
      this.airRotation += TUNING.airRotationSpeed * dt;
      this.playerSprite.setRotation(Phaser.Math.DegToRad(this.airRotation));
    } else {
      // Normal jump: flail through the run cycle only while a direction
      // is actively held, matching the grounded behavior.
      if (moveDir !== 0) {
        this.playerSprite.setFlipX(moveDir < 0);
        this.runFrameTimer += delta;
        if (this.runFrameTimer > TUNING.runFrameMs) {
          this.runFrameTimer = 0;
          this.runFrameIndex = (this.runFrameIndex + 1) % SPRINT_ORDER.length;
          const frameName = SPRINT_ORDER[this.runFrameIndex];
          this.setPlayerTexture(SPRINT_FRAME_ATLAS[frameName], frameName, 0.35);
        }
      } else {
        this.setPlayerTexture("atlas0", "GymnastSprint0002", 0.35);
      }
    }

    // --- Camera follow + infinite world streaming ---
    const scrollX = this.playerWorldX - TUNING.cameraOffsetX;
    this.cameras.main.scrollX = scrollX;
    // Vertical follow only kicks in once the player goes above the normal
    // play area (e.g. during a trampett super jump), so they never fly
    // out of frame; smoothly returns to the default view otherwise.
    const targetScrollY = Math.min(0, this.playerWorldY - 300);
    this.cameras.main.scrollY = Phaser.Math.Linear(this.cameras.main.scrollY, targetScrollY, 0.15);
    this.playerContainer.setPosition(this.playerWorldX, this.playerWorldY);

    // Background scrolls slower than the world (parallax) and never
    // moves vertically, so it stays locked to its base/ground level.
    this.bg.tilePositionX = scrollX * this.bgParallaxFactor;

    this.distance = Math.max(this.distance, Math.floor((this.playerWorldX - 80) / 10));
    this.distanceText.setText(`${this.distance}m`);

    while (this.rightmostX < scrollX + 1100) this.spawnNextPlatform();
    this.cleanupPlatforms(scrollX);
  }
}

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 550,
  parent: "game-container",
  backgroundColor: "#16213e",
  scene: [PlatformerScene],
};

async function boot() {
  heartbeat('boot() started - checking Phaser...');
  if (typeof Phaser === 'undefined') {
    throw new Error('Phaser failed to load from cdnjs.cloudflare.com (no internet, or the CDN is blocked on this network/device)');
  }
  heartbeat('Phaser present, decoding images...');
  const [img0, img1] = await Promise.all([
    loadImageFromDataURI(`data:image/png;base64,${ATLAS0_PNG_B64}`),
    loadImageFromDataURI(`data:image/png;base64,${ATLAS1_PNG_B64}`),
  ]);
  heartbeat('images decoded, parsing atlas XML...');
  const xmlText0 = atob(ATLAS0_XML_B64);
  const xmlText1 = atob(ATLAS1_XML_B64);
  const parser = new DOMParser();
  const xml0 = parser.parseFromString(xmlText0, "application/xml");
  const xml1 = parser.parseFromString(xmlText1, "application/xml");
  heartbeat('building normalized textures...');
  window.__atlasAssets = {
    img0, img1, xml0, xml1,
    rotatedOverrides: {
      ...buildNormalizedTextures(img0, xml0, USED_FRAME_NAMES),
      ...buildNormalizedTextures(img1, xml1, USED_FRAME_NAMES),
    },
  };
  heartbeat('textures built, setting reset icon...');

  // Use the TwistIcon sprite (a circular-arrow icon) as the reset
  // button's graphic instead of a text glyph.
  const twistIconEl = xml1.querySelector('SubTexture[name="TwistIcon"]');
  if (twistIconEl) {
    const tx = parseFloat(twistIconEl.getAttribute("x"));
    const ty = parseFloat(twistIconEl.getAttribute("y"));
    const tw = parseFloat(twistIconEl.getAttribute("width"));
    const th = parseFloat(twistIconEl.getAttribute("height"));
    const iconCanvas = document.createElement("canvas");
    iconCanvas.width = tw;
    iconCanvas.height = th;
    iconCanvas.getContext("2d").drawImage(img1, tx, ty, tw, th, 0, 0, tw, th);
    const resetBtn = document.getElementById("btn-reset");
    resetBtn.innerHTML = "";
    const iconImg = document.createElement("img");
    iconImg.src = iconCanvas.toDataURL();
    iconImg.style.cssText = "width:30px;height:30px;pointer-events:none;";
    resetBtn.appendChild(iconImg);
  }

  heartbeat('starting Phaser.Game...');
  new Phaser.Game(config);
  heartbeat('Phaser.Game constructed');
}

boot().catch((err) => {
  showFatalError(err.message || 'boot() failed', err.stack || String(err));
});

</script>
